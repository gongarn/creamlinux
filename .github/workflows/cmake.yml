name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      releaseTag:
        description: 'Release tag (e.g. v2.3.0). Leave empty to skip the release'
        required: false
        default: ''
      releaseName:
        description: 'Release name (optional)'
        required: false
        default: ''

env:
  BUILD_TYPE: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Fix apt mirrors (workaround for mirror+file 404s on i386 packages)
      run: |
        sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://azure.archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt-get update

    - name: Install gcc-multilib, g++-multilib
      run: sudo apt-get install -y gcc-multilib g++-multilib

    - name: Build 32-bit and 64-bit
      run: |
        chmod +x ./build.sh
        ./build.sh
      shell: bash

    - name: Package artifacts
      run: |
        cd output
        zip -r creamlinux.zip .

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-artifacts
        path: |
          ${{ github.workspace }}/output

    - name: Run tests
      working-directory: ${{ github.workspace }}/build/64
      run: ctest --output-on-failure

    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.releaseTag != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.event.inputs.releaseTag }}" \
          --title "${{ github.event.inputs.releaseName }}" \
          --notes "Automated build from master" \
          output/creamlinux.zip
