name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      releaseTag:
        description: 'Release tag (e.g. v2.3.0). Leave empty to skip the release'
        required: false
        default: ''
      releaseName:
        description: 'Release name (optional)'
        required: false
        default: ''

env:
  BUILD_TYPE: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
    - name: Install build deps
      run: |
        apt-get update
        apt-get install -y --no-install-recommends build-essential gcc-multilib g++-multilib cmake git zip python3 gh

    - uses: actions/checkout@v4

    - name: Build 32-bit and 64-bit
      run: |
        chmod +x ./build.sh
        ./build.sh
      shell: bash

    - name: Assert glibc compatibility (max required GLIBC symbol version <= 2.35)
      run: |
        maxver=$(objdump -T output/lib64Creamlinux.so output/lib32Creamlinux.so \
          | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1)
        echo "max required: $maxver"
        case "$maxver" in
          GLIBC_2.2[0-9]|GLIBC_2.3[0-5]) ;;   # <= 2.35 OK
          *) echo "::error::glibc requirement exceeds 2.35 ($maxver)"; exit 1 ;;
        esac
      shell: bash

    - name: Package artifacts
      run: |
        cd output
        zip -r creamlinux.zip .

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-artifacts
        path: |
          ${{ github.workspace }}/output

    - name: Run tests
      working-directory: ${{ github.workspace }}/build/64
      run: ctest --output-on-failure

    - name: Run Python tests and syntax checks
      run: |
        python3 -m py_compile tools/*.py
        python3 -m unittest discover -s tools/tests

    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.releaseTag != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.event.inputs.releaseTag }}" \
          --title "${{ github.event.inputs.releaseName }}" \
          --notes "Automated build from master" \
          output/creamlinux.zip
